<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Betsel Stack &mdash; Mobile</title>
<style>
  :root{ --bg:#252525; --panel:#1b1b1b; --line:#3a3a3a; --go:#f5a623; --g2:#c8831a; --muted:#9a9a9a; --txt:#eee; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; background:var(--bg); color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  body{ display:flex; flex-direction:column; overflow:hidden; }
  .mb-top{ flex:0 0 auto; display:flex; align-items:center; justify-content:space-between;
    padding:12px 16px; border-bottom:2px solid var(--go); }
  .mb-top .brand{ font-size:13px; letter-spacing:.18em; text-transform:uppercase; color:var(--go); }
  .mb-top .step{ font-size:11px; letter-spacing:.12em; color:var(--muted); }
  .mb-screen{ flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:16px; }
  .mb-screen[hidden]{ display:none; }
  label{ display:block; font-size:12px; letter-spacing:.08em; color:var(--muted); margin:14px 0 6px; }
  input,select{ width:100%; height:48px; background:var(--panel); color:var(--txt);
    border:1px solid var(--line); border-radius:8px; padding:0 14px; font-size:17px; }
  input:focus,select:focus{ outline:none; border-color:var(--go); }
  .row3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .seg{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .seg button{ height:44px; background:var(--panel); color:var(--txt); border:1px solid var(--line);
    border-radius:8px; font-size:15px; }
  .seg button.on{ background:var(--go); color:#1a1a1a; border-color:var(--go); font-weight:600; }
  .btn{ width:100%; height:54px; border:0; border-radius:10px; font-size:17px; font-weight:600;
    background:var(--go); color:#1a1a1a; margin-top:22px; }
  .btn.sec{ background:transparent; color:var(--txt); border:1px solid var(--line); font-weight:500; }
  .btn:active{ transform:scale(.99); }
  .hint{ font-size:12px; color:var(--muted); margin-top:6px; }

  /* Viewer */
  .vwrap{ display:flex; flex-direction:column; height:100%; }
  .vhead{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .vhead .pos{ font-size:12px; letter-spacing:.12em; color:var(--go); }
  .pname{ font-size:18px; font-weight:600; margin:2px 0 10px; }
  .canvas-card{ position:relative; background:var(--panel); border:1px solid var(--line);
    border-radius:12px; padding:10px; touch-action:pan-y; }
  canvas{ display:block; width:100%; height:auto; border-radius:6px; }
  .nav{ position:absolute; top:50%; transform:translateY(-50%); width:40px; height:40px; border-radius:50%;
    background:rgba(0,0,0,.55); color:#fff; border:1px solid var(--line); font-size:20px; line-height:38px;
    text-align:center; }
  .nav.prev{ left:14px; } .nav.next{ right:14px; }
  .stats{ display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:8px; margin:14px 0; }
  .stat{ background:var(--panel); border-radius:8px; padding:10px 6px; text-align:center; }
  .stat .v{ font-size:18px; font-weight:600; } .stat .v.acc{ color:var(--go); }
  .stat .k{ font-size:10px; color:var(--muted); letter-spacing:.06em; margin-top:2px; }
  .vactions{ margin-top:auto; display:flex; gap:8px; }
  .vactions .btn{ margin-top:0; }

  #mbToast{ position:fixed; left:50%; bottom:22px; transform:translateX(-50%); z-index:9999;
    max-width:88vw; padding:12px 18px; border-radius:8px; font-size:13px; letter-spacing:.04em;
    box-shadow:0 6px 24px rgba(0,0,0,.5); opacity:0; transition:opacity .35s; pointer-events:none; }
  #mbToast.show{ opacity:1; }
  #mbToast.ok{ background:#0e2a0e; color:#7fe07f; border:1px solid #2f7a2f; }
  #mbToast.err{ background:#3a0e0e; color:#ff8080; border:1px solid #aa3333; }

  /* Cloud files sheet */
  .mb-sheet{ position:fixed; inset:0; z-index:9000; background:var(--bg); display:flex; flex-direction:column; }
  .mb-sheet[hidden]{ display:none; }
  .mb-sheet .sh-top{ flex:0 0 auto; display:flex; align-items:center; justify-content:space-between;
    padding:12px 16px; border-bottom:2px solid var(--go); }
  .mb-sheet .sh-top .ttl{ font-size:13px; letter-spacing:.18em; text-transform:uppercase; color:var(--go); }
  .mb-sheet .sh-x{ background:transparent; border:1px solid var(--line); color:var(--txt);
    height:34px; padding:0 14px; border-radius:8px; font-size:13px; }
  .mb-list{ flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:12px 16px; }
  .mb-item{ display:flex; align-items:center; gap:10px; background:var(--panel); border:1px solid var(--line);
    border-radius:10px; padding:12px 14px; margin-bottom:10px; }
  .mb-item .meta{ flex:1 1 auto; min-width:0; }
  .mb-item .meta .nm{ font-size:16px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .mb-item .meta .dt{ font-size:11px; color:var(--muted); margin-top:2px; letter-spacing:.04em; }
  .mb-item .open{ flex:0 0 auto; height:38px; padding:0 16px; border:0; border-radius:8px;
    background:var(--go); color:#1a1a1a; font-weight:600; font-size:14px; }
  .mb-item .del{ flex:0 0 auto; height:38px; padding:0 12px; border:1px solid var(--line); border-radius:8px;
    background:transparent; color:var(--muted); font-size:12px; }
  .mb-empty{ text-align:center; color:var(--muted); font-size:14px; line-height:1.6; padding:40px 20px; }
  .mb-sheet .sh-tabs{ flex:0 0 auto; display:flex; gap:8px; padding:10px 16px 2px; }
  .mb-sheet .sh-tab{ flex:1; height:38px; background:var(--panel); color:var(--txt); border:1px solid var(--line);
    border-radius:8px; font-size:13px; letter-spacing:.04em; }
  .mb-sheet .sh-tab.on{ background:var(--go); color:#1a1a1a; border-color:var(--go); font-weight:600; }
  #mbPdfFrame{ flex:1 1 auto; width:100%; border:0; background:#525659; }
</style>
</head>
<body>

<div class="mb-top">
  <span class="brand">Betsel Stack</span>
  <span class="step" id="mbStep">Setup</span>
</div>

<!-- ===== Screen 1: input ===== -->
<section id="mbInput" class="mb-screen">
  <label>Units</label>
  <div class="seg">
    <button id="mbUnitIn" class="on" onclick="mbSetUnit('in')">Inches</button>
    <button id="mbUnitMm" onclick="mbSetUnit('mm')">Millimeters</button>
  </div>

  <label>Case size (<span class="mbUnit">in</span>)</label>
  <div class="row3">
    <input id="mbCaseL" type="number" inputmode="decimal" placeholder="Length" />
    <input id="mbCaseW" type="number" inputmode="decimal" placeholder="Width" />
    <input id="mbCaseH" type="number" inputmode="decimal" placeholder="Height" />
  </div>

  <label>Pallet</label>
  <select id="mbPallet" onchange="mbPalletChange()"></select>
  <div id="mbCustomPal" class="row2" style="margin-top:8px; display:none;">
    <input id="mbPalW" type="number" inputmode="decimal" placeholder="Pallet width" />
    <input id="mbPalL" type="number" inputmode="decimal" placeholder="Pallet length" />
  </div>

  <label>Max stack height (<span class="mbUnit">in</span>)</label>
  <input id="mbMaxH" type="number" inputmode="decimal" value="60" />
  <div class="hint">Total height including the pallet. Used to figure out how many layers fit.</div>

  <label>Allowed overhang (<span class="mbUnit">in</span>, optional)</label>
  <input id="mbOH" type="number" inputmode="decimal" placeholder="0" />

  <label>Project name (optional)</label>
  <input id="mbName" type="text" placeholder="Auto-named if left blank" />

  <button class="btn" onclick="mbGenerate()">Generate patterns</button>
  <button class="btn sec" style="margin-top:12px;" onclick="mbOpenCloud()">Open from cloud</button>
</section>

<!-- ===== Screen 2: viewer ===== -->
<section id="mbViewer" class="mb-screen" hidden>
  <div class="vwrap">
    <div class="vhead">
      <span class="pos" id="mbPos">Pattern 1 of 1</span>
      <button class="btn sec" style="width:auto; height:34px; margin:0; padding:0 14px; font-size:13px;" onclick="mbBackToInput()">Edit inputs</button>
    </div>
    <div class="pname" id="mbPName">&nbsp;</div>

    <div class="canvas-card" id="mbCanvasCard">
      <canvas id="mbCanvas"></canvas>
      <div class="nav prev" onclick="mbStep(-1)">&#8249;</div>
      <div class="nav next" onclick="mbStep(1)">&#8250;</div>
    </div>

    <div class="stats">
      <div class="stat"><div class="v" id="mbPerLayer">0</div><div class="k">per layer</div></div>
      <div class="stat"><div class="v" id="mbLayers">0</div><div class="k">layers</div></div>
      <div class="stat"><div class="v" id="mbTotal">0</div><div class="k">total</div></div>
      <div class="stat"><div class="v acc" id="mbCube">0%</div><div class="k">cube</div></div>
    </div>

    <div class="vactions">
      <button class="btn" onclick="mbSaveCloud()">Save to cloud</button>
    </div>
  </div>
</section>

<!-- ===== Cloud files sheet ===== -->
<section id="mbCloud" class="mb-sheet" hidden>
  <div class="sh-top">
    <span class="ttl">My saved files</span>
    <button class="sh-x" onclick="mbCloseCloud()">Close</button>
  </div>
  <div class="sh-tabs">
    <button id="mbTabPat" class="sh-tab on" onclick="mbCloudTab('patterns')">Patterns</button>
    <button id="mbTabRpt" class="sh-tab" onclick="mbCloudTab('reports')">Reports</button>
  </div>
  <div id="mbCloudList" class="mb-list"></div>
</section>

<!-- ===== Report PDF viewer ===== -->
<section id="mbPdf" class="mb-sheet" hidden>
  <div class="sh-top">
    <span class="ttl" id="mbPdfTtl">Report</span>
    <button class="sh-x" onclick="mbClosePdf()">Close</button>
  </div>
  <iframe id="mbPdfFrame" title="Saved report"></iframe>
</section>

<div id="mbToast"></div>

<script>
const COLORS=['#3A7BD5','#27AE60','#E67E22','#C0392B','#8E44AD','#16A085','#D35400','#2980B9','#F39C12','#1ABC9C',
              '#884EA0','#2471A3','#1E8449','#B7950B','#784212','#1A5276','#7D6608','#117A65','#922B21','#515A5A',
              '#2E86C1','#1D8348','#D4AC0D','#7D3C98','#1F618D','#196F3D','#9A7D0A','#6E2F8E'];
let ST={
  isMetric:false, palletKey:'full', maxH:'', maxOverhang:'',
  cases:[{id:1,w:'',l:'',h:'',wt:'',color:COLORS[0],label:'Case A'}],
  layerStack:[],   // [{layerIdx, patternIdx, degree}] — per-layer overrides
  interlockMode: false,  // single-case: alternate layers 180°
  view:'2d', patterns:[], selPat:0,
  multiMode:false, placements:[], layers:1, stats:null,
  layerEdits:{},  // current pattern's edits: {A:[...], B:[...]} — mirrors _patEdits[selPat]
  _patEdits:{},   // per-pattern edit store: {0:{A,B}, 1:{A,B}, ...} — persists across selections
  _patModified: new Set(), // indices of patterns that have been genuinely modified by user
  cornerPosts:false, slipSheets:false, slipSheetLayers:[],
  palletWeightLimit:'',
};
const r2=v=>Math.round(v*100)/100;
const toIn=v=>ST.isMetric?v/25.4:v;
const dp=v=>ST.isMetric?r2(v*25.4):r2(v);
const u=()=>ST.isMetric?'mm':'in';
const cv=val=>toIn(parseFloat(val)||0);
// Weight helpers — always stored in lbs internally
const wu=()=>ST.isMetric?'kg':'lbs';
const wt=lbs=>ST.isMetric?r2(lbs*0.453592):r2(lbs);
const wtFmt=(lbs)=>lbs>0?wt(lbs)+' '+wu():'—';
</script>

<!-- Shared pattern engine (protected/pallet-engine.js via /api/engine) -->
<script src="/api/engine"></script>
<script>
if(typeof buildPatterns!=='function'){
  alert('The pattern engine did not load. Please reload the page. If this keeps happening, log out and back in.');
}
</script>


<script>
// ── Mobile UI (Path A: generate + swipe-view) ─────────────────
var MB = { unit:'in', patterns:[], idx:0, lastInputs:null };

var MB_PALLETS = [
  { key:'full',    label:'Full \u2014 48 x 40 in',    w:48, l:40, h:5.5 },
  { key:'half',    label:'Half \u2014 48 x 20 in',    w:48, l:20, h:5.5 },
  { key:'quarter', label:'Quarter \u2014 24 x 20 in', w:24, l:20, h:5.5 },
  { key:'sixth',   label:'Sixth \u2014 16 x 20 in',   w:16, l:20, h:5.5 },
  { key:'custom',  label:'Custom size',               w:48, l:40, h:5.5 }
];

function mbEl(id){ return document.getElementById(id); }
function mbVal(id){ var e = mbEl(id); return e ? e.value : ''; }
function mbNum(id){ return parseFloat(mbVal(id)) || 0; }
function mbToInches(v){ return MB.unit === 'mm' ? (v / 25.4) : v; }

function mbInitPallets(){
  var sel = mbEl('mbPallet');
  sel.innerHTML = '';
  MB_PALLETS.forEach(function(p){
    var o = document.createElement('option');
    o.value = p.key; o.textContent = p.label;
    sel.appendChild(o);
  });
}

function mbSetUnit(u){
  MB.unit = u;
  mbEl('mbUnitIn').classList.toggle('on', u === 'in');
  mbEl('mbUnitMm').classList.toggle('on', u === 'mm');
  var label = (u === 'mm') ? 'mm' : 'in';
  var spans = document.querySelectorAll('.mbUnit');
  for(var i=0;i<spans.length;i++) spans[i].textContent = label;
}

function mbPalletChange(){
  var custom = mbEl('mbPallet').value === 'custom';
  mbEl('mbCustomPal').style.display = custom ? 'grid' : 'none';
}

function mbCurrentPallet(){
  var key = mbEl('mbPallet').value;
  for(var i=0;i<MB_PALLETS.length;i++) if(MB_PALLETS[i].key === key) return MB_PALLETS[i];
  return MB_PALLETS[0];
}

function mbToast(msg, isErr){
  var t = mbEl('mbToast');
  t.textContent = msg;
  t.className = 'show ' + (isErr ? 'err' : 'ok');
  clearTimeout(t._timer);
  t._timer = setTimeout(function(){ t.className = ''; }, 3200);
}

function mbGenerate(){
  // Feed the shared engine the same way desktop does.
  ST.isMetric = (MB.unit === 'mm');

  var cLraw = mbVal('mbCaseL'), cWraw = mbVal('mbCaseW'), cHraw = mbVal('mbCaseH');
  var cL = mbToInches(mbNum('mbCaseL'));
  var cW = mbToInches(mbNum('mbCaseW'));
  var cH = mbToInches(mbNum('mbCaseH'));
  if(!(cW > 0 && cL > 0 && cH > 0)){ mbToast('Enter case length, width, and height', true); return; }

  var pal = mbCurrentPallet();
  var pW, pL, pH = pal.h;
  if(pal.key === 'custom'){
    pW = mbToInches(mbNum('mbPalW'));
    pL = mbToInches(mbNum('mbPalL'));
    if(!(pW > 0 && pL > 0)){ mbToast('Enter custom pallet width and length', true); return; }
  } else {
    pW = pal.w; pL = pal.l;
  }

  var ohRaw = mbVal('mbOH');
  ST.maxOverhang = ohRaw || '';

  var maxHraw = mbVal('mbMaxH');
  var maxHin = (maxHraw !== '') ? mbToInches(mbNum('mbMaxH')) : 60;
  var layers = (cH > 0) ? Math.max(1, Math.floor((maxHin - pH) / cH)) : 1;

  var pats;
  try {
    pats = buildPatterns(cW, cL, pW, pL);
    // Same post-step the desktop builder runs, so mobile shows the exact
    // same layouts in the same order (spread mode, desktop's default).
    ST.tightMode = false;
    pats = pats.map(function(p){ return _distributePattern(p, pW, pL); });
  } catch(e){
    mbToast('Could not generate: ' + e.message, true); return;
  }
  if(!pats || !pats.length){ mbToast('No patterns fit this case on this pallet', true); return; }

  MB.patterns = pats.map(function(p){
    return { p:p, layers:layers, total:(p.count || 0) * layers, pW:pW, pL:pL, pH:pH };
  });
  MB.idx = 0;
  MB.lastInputs = {
    cLraw:cLraw, cWraw:cWraw, cHraw:cHraw, maxHraw:maxHraw, ohRaw:ohRaw,
    palKey:pal.key, pWin:pW, pLin:pL, isMetric:(MB.unit==='mm')
  };

  mbShowViewer();
  mbRenderPattern();
}

function mbShowViewer(){
  mbEl('mbInput').hidden = true;
  mbEl('mbViewer').hidden = false;
  mbEl('mbStep').textContent = 'Patterns';
}
function mbBackToInput(){
  mbEl('mbViewer').hidden = true;
  mbEl('mbInput').hidden = false;
  mbEl('mbStep').textContent = 'Setup';
}

function mbStep(dir){
  if(!MB.patterns.length) return;
  MB.idx = (MB.idx + dir + MB.patterns.length) % MB.patterns.length;
  mbRenderPattern();
}

function mbRenderPattern(){
  var item = MB.patterns[MB.idx];
  if(!item) return;
  var p = item.p;
  mbEl('mbPos').textContent = 'Pattern ' + (MB.idx + 1) + ' of ' + MB.patterns.length;
  mbEl('mbPName').textContent = p.name || 'Pattern';
  mbEl('mbPerLayer').textContent = p.count || 0;
  mbEl('mbLayers').textContent = item.layers;
  mbEl('mbTotal').textContent = item.total;
  mbEl('mbCube').textContent = (p.cubicEff != null ? p.cubicEff : 0) + '%';
  mbDraw(item);
}

function mbDraw(item){
  var canvas = mbEl('mbCanvas');
  var card = mbEl('mbCanvasCard');
  var cssW = card.clientWidth - 20;            // minus padding
  if(cssW < 80) cssW = 280;
  var ratio = item.pL / item.pW;
  var cssH = Math.max(180, Math.min(360, cssW * ratio));
  var dpr = window.devicePixelRatio || 1;
  canvas.style.width = cssW + 'px';
  canvas.style.height = cssH + 'px';
  canvas.width = Math.round(cssW * dpr);
  canvas.height = Math.round(cssH * dpr);

  var ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cssW, cssH);

  var pad = 14;
  var scale = Math.min((cssW - 2*pad) / item.pW, (cssH - 2*pad) / item.pL);
  var ox = (cssW - item.pW * scale) / 2;
  var oy = (cssH - item.pL * scale) / 2;

  // pallet base
  ctx.fillStyle = '#141414';
  ctx.fillRect(ox, oy, item.pW * scale, item.pL * scale);
  ctx.strokeStyle = '#555'; ctx.lineWidth = 2;
  ctx.strokeRect(ox, oy, item.pW * scale, item.pL * scale);

  // cases
  var pls = item.p.placements || [];
  for(var i=0;i<pls.length;i++){
    var pl = pls[i];
    var x = ox + pl.x * scale, y = oy + pl.y * scale;
    var w = pl.w * scale, l = pl.l * scale;
    ctx.fillStyle = (pl.ori === 0) ? '#f5a623' : '#c8831a';
    ctx.fillRect(x + 1, y + 1, w - 2, l - 2);
    ctx.strokeStyle = '#252525'; ctx.lineWidth = 1.5;
    ctx.strokeRect(x + 1, y + 1, w - 2, l - 2);
  }
}

// Swipe between patterns
(function(){
  var sx = 0, sy = 0, tracking = false;
  var card = mbEl('mbCanvasCard');
  if(!card) return;
  card.addEventListener('touchstart', function(e){
    var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; tracking = true;
  }, { passive:true });
  card.addEventListener('touchend', function(e){
    if(!tracking) return; tracking = false;
    var t = e.changedTouches[0];
    var dx = t.clientX - sx, dy = t.clientY - sy;
    if(Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)) mbStep(dx < 0 ? 1 : -1);
  }, { passive:true });
})();

// Build a desktop-compatible .kbm bundle from the current pattern's inputs.
function mbBuildBundle(){
  var inp = MB.lastInputs || {};
  var name = (mbVal('mbName') || '').trim();
  if(!name){
    name = inp.cLraw + 'x' + inp.cWraw + 'x' + inp.cHraw + ' on ' + (inp.palKey || 'pallet');
  }
  var bundle = {
    version: '1.0',
    savedAt: new Date().toISOString(),
    settings: { units: (inp.isMetric ? 'mm' : 'in') },
    project: { name: name, desc: '', notes: 'Saved from mobile' },
    state: {
      isMetric: !!inp.isMetric,
      palletKey: inp.palKey || 'full',
      maxH: inp.maxHraw || '',
      maxOverhang: inp.ohRaw || '',
      palletWeightLimit: '',
      cornerPosts: false,
      slipSheets: false,
      slipSheetLayers: [],
      // Desktop's fields: w = Width input, l = Length input.
      cases: [{ id:1, w: inp.cWraw, l: inp.cLraw, h: inp.cHraw, wt:'', color:'#3A7BD5', label:'Case A' }],
      selPat: MB.idx,
      layers: MB.patterns[MB.idx] ? MB.patterns[MB.idx].layers : 1,
      customPallet: (inp.palKey === 'custom')
        ? { label:'Custom', w: inp.pWin, l: inp.pLin, h:5.5, tare:50 } : null
    },
    truck: null
  };
  return { name: name, bundle: bundle };
}

async function mbSaveCloud(){
  if(!MB.patterns.length){ mbToast('Generate a pattern first', true); return; }
  var built = mbBuildBundle();
  mbToast('Saving to cloud...', false);
  try {
    var res = await fetch('/api/patterns', {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      credentials:'same-origin',
      body: JSON.stringify({ name: built.name, data: built.bundle })
    });
    if(res.status === 401){ mbToast('Please sign in again', true); return; }
    if(res.status === 403){ mbToast('Your access has expired', true); return; }
    if(!res.ok){ var t = await res.text().catch(function(){ return ''; });
      mbToast('Save failed: ' + (t || ('HTTP ' + res.status)), true); return; }
    var row = await res.json();
    mbToast('Saved to cloud as "' + (row && row.name ? row.name : built.name) + '"', false);
  } catch(err){
    mbToast('Save failed: ' + (err && err.message ? err.message : 'network error'), true);
  }
}

// ---- Cloud files: list / open / delete (all scoped to the signed-in user) ----
function mbEsc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}
function mbFmtDate(iso){
  try { var d = new Date(iso); return isNaN(d) ? '' : d.toLocaleDateString(); }
  catch(e){ return ''; }
}
var mbCloudTabCur = 'patterns';
var mbPdfBlobUrl = null;

function mbOpenCloud(){
  mbEl('mbCloud').hidden = false;
  mbCloudTab(mbCloudTabCur || 'patterns');
}
function mbCloseCloud(){
  mbEl('mbCloud').hidden = true;
}
function mbCloudTab(which){
  mbCloudTabCur = (which === 'reports') ? 'reports' : 'patterns';
  mbEl('mbTabPat').classList.toggle('on', mbCloudTabCur === 'patterns');
  mbEl('mbTabRpt').classList.toggle('on', mbCloudTabCur === 'reports');
  if(mbCloudTabCur === 'reports') mbLoadReportList();
  else mbLoadCloudList();
}

async function mbLoadCloudList(){
  var box = mbEl('mbCloudList');
  box.innerHTML = '<div class="mb-empty">Loading your saved files\u2026</div>';
  try {
    var res = await fetch('/api/patterns', { credentials:'same-origin' });
    if(res.status === 401){ box.innerHTML = '<div class="mb-empty">Please sign in again.</div>'; return; }
    if(res.status === 403){ box.innerHTML = '<div class="mb-empty">Your access has expired.</div>'; return; }
    if(!res.ok){ box.innerHTML = '<div class="mb-empty">Could not load files (HTTP ' + res.status + ').</div>'; return; }
    var json = await res.json();
    var rows = (json && json.patterns) || [];
    if(!rows.length){
      box.innerHTML = '<div class="mb-empty">No saved files yet.<br>Generate a pattern and tap \u201CSave to cloud.\u201D</div>';
      return;
    }
    var html = '';
    rows.forEach(function(r){
      var when = mbFmtDate(r.updated_at || r.created_at);
      var id = mbEsc(r.id);
      html += '<div class="mb-item">' +
        '<div class="meta"><div class="nm">' + mbEsc(r.name || 'Untitled pattern') + '</div>' +
        (when ? '<div class="dt">' + when + '</div>' : '') + '</div>' +
        '<button class="open" onclick="mbOpenPattern(\'' + id + '\')">Open</button>' +
        '<button class="del" onclick="mbDeletePattern(\'' + id + '\')">Delete</button>' +
        '</div>';
    });
    box.innerHTML = html;
  } catch(err){
    box.innerHTML = '<div class="mb-empty">Network error loading files.</div>';
  }
}

async function mbOpenPattern(id){
  mbToast('Opening\u2026', false);
  try {
    var res = await fetch('/api/patterns?id=' + encodeURIComponent(id), { credentials:'same-origin' });
    if(!res.ok){ mbToast('Could not open (HTTP ' + res.status + ')', true); return; }
    var row = await res.json();
    var bundle = row && row.data;
    if(!bundle || !bundle.state){ mbToast('That file is missing its saved settings', true); return; }
    mbCloseCloud();
    mbLoadBundle(bundle);
    mbToast('Opened \u201C' + (row.name || 'pattern') + '\u201D', false);
  } catch(err){
    mbToast('Open failed: ' + (err && err.message ? err.message : 'network error'), true);
  }
}

async function mbDeletePattern(id){
  if(!window.confirm('Delete this file from the cloud? This cannot be undone.')) return;
  try {
    var res = await fetch('/api/patterns?id=' + encodeURIComponent(id), {
      method:'DELETE', credentials:'same-origin'
    });
    if(!res.ok){ mbToast('Delete failed (HTTP ' + res.status + ')', true); return; }
    mbToast('Deleted', false);
    mbLoadCloudList();
  } catch(err){
    mbToast('Delete failed: ' + (err && err.message ? err.message : 'network error'), true);
  }
}

// ---- Reports: list / view (PDF) / delete (scoped to the signed-in user) ----

    if(res.status === 401){ box.innerHTML = '<div class="mb-empty">Please sign in again.</div>'; return; }

      return;
    }
    var html = '';
    rows.forEach(function(r){
      var when = mbFmtDate(r.updated_at || r.created_at);
      var id = mbEsc(r.id);

        '<div class="meta"><div class="nm">' + mbEsc(r.name || 'Untitled report') + '</div>' +

        '<button class="open" onclick="mbViewReport(\'' + id + '\')">View</button>' +

        '</div>';
    });
    box.innerHTML = html;
  } catch(err){
    box.innerHTML = '<div class="mb-empty">Network error loading reports.</div>';
  }
}

// Convert a data: URI (base64 or url-encoded) into a Blob URL. Blob URLs render
// in an <iframe> reliably across mobile browsers, unlike long data: URIs.
function mbDataUriToBlobUrl(dataUri){
  var comma = dataUri.indexOf(',');
  if(comma < 0) return null;
  var meta = dataUri.slice(5, comma);           // strip leading "data:"
  var mime = (meta.split(';')[0]) || 'application/pdf';
  var isB64 = /;base64/i.test(meta);
  var payload = dataUri.slice(comma + 1);
  var bytes;
  if(isB64){
    var bin = atob(payload);
    bytes = new Uint8Array(bin.length);
    for(var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  } else {
    bytes = new TextEncoder().encode(decodeURIComponent(payload));
  }
  return URL.createObjectURL(new Blob([bytes], { type: mime }));
}

async function mbViewReport(id){
  mbToast('Opening report\u2026', false);
  try {
    var res = await fetch('/api/reports?id=' + encodeURIComponent(id), { credentials:'same-origin' });
    if(!res.ok){ mbToast('Could not open (HTTP ' + res.status + ')', true); return; }
    var row = await res.json();
    if(!row || !row.pdf){ mbToast('That report has no saved PDF', true); return; }
    var url = mbDataUriToBlobUrl(row.pdf);
    if(!url){ mbToast('Could not read that report', true); return; }
    if(mbPdfBlobUrl){ URL.revokeObjectURL(mbPdfBlobUrl); }
    mbPdfBlobUrl = url;
    mbEl('mbPdfTtl').textContent = row.name || 'Report';
    mbEl('mbPdfFrame').src = url;
    mbEl('mbPdf').hidden = false;
  } catch(err){
    mbToast('Open failed: ' + (err && err.message ? err.message : 'network error'), true);
  }
}

function mbClosePdf(){
  mbEl('mbPdf').hidden = true;
  mbEl('mbPdfFrame').src = 'about:blank';
  if(mbPdfBlobUrl){ URL.revokeObjectURL(mbPdfBlobUrl); mbPdfBlobUrl = null; }
}

async function mbDeleteReport(id){
  if(!window.confirm('Delete this report from the cloud? This cannot be undone.')) return;
  try {
    var res = await fetch('/api/reports?id=' + encodeURIComponent(id), {
      method:'DELETE', credentials:'same-origin'
    });
    if(!res.ok){ mbToast('Delete failed (HTTP ' + res.status + ')', true); return; }
    mbToast('Deleted', false);
    mbLoadReportList();
  } catch(err){
    mbToast('Delete failed: ' + (err && err.message ? err.message : 'network error'), true);
  }
}

// Rehydrate the input form from a saved .kbm bundle, then regenerate + jump to
// the pattern that was selected when it was saved.
function mbLoadBundle(bundle){
  var st = (bundle && bundle.state) || {};
  mbSetUnit(st.isMetric ? 'mm' : 'in');

  var c = (st.cases && st.cases[0]) || {};
  mbEl('mbCaseL').value = (c.l != null && c.l !== '') ? c.l : '';   // l = Length (same as desktop)
  mbEl('mbCaseW').value = (c.w != null && c.w !== '') ? c.w : '';   // w = Width
  mbEl('mbCaseH').value = (c.h != null && c.h !== '') ? c.h : '';   // h = Height
  mbEl('mbMaxH').value  = (st.maxH != null && st.maxH !== '') ? st.maxH : 60;
  mbEl('mbOH').value    = (st.maxOverhang != null) ? st.maxOverhang : '';

  var pk = st.palletKey || 'full';
  mbEl('mbPallet').value = pk;
  mbPalletChange();
  if(pk === 'custom' && st.customPallet){
    // customPallet is stored in inches; show it in the active display unit.
    var f = st.isMetric ? 25.4 : 1;
    var rnd = function(v){ return Math.round(v * f * 100) / 100; };
    mbEl('mbPalW').value = (st.customPallet.w != null) ? rnd(st.customPallet.w) : '';
    mbEl('mbPalL').value = (st.customPallet.l != null) ? rnd(st.customPallet.l) : '';
  }

  mbEl('mbName').value = (bundle.project && bundle.project.name) ? bundle.project.name : '';

  mbGenerate();

  var want = parseInt(st.selPat, 10);
  if(!isNaN(want) && want >= 0 && want < MB.patterns.length){
    MB.idx = want;
    mbRenderPattern();
  }
}

// init
mbInitPallets();
mbPalletChange();
</script>
