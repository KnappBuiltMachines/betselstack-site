  mbEl('mbInput').hidden = true;
  mbEl('mbViewer').hidden = false;
  mbEl('mbStep').textContent = 'Patterns';
}
function mbBackToInput(){
  mbEl('mbViewer').hidden = true;
  mbEl('mbInput').hidden = false;
  mbEl('mbStep').textContent = 'Setup';
}

function mbStep(dir){
  if(!MB.patterns.length) return;
  MB.idx = (MB.idx + dir + MB.patterns.length) % MB.patterns.length;
  mbRenderPattern();
}

function mbRenderPattern(){
  var item = MB.patterns[MB.idx];
  if(!item) return;
  var p = item.p;
  mbEl('mbPos').textContent = 'Pattern ' + (MB.idx + 1) + ' of ' + MB.patterns.length;
  mbEl('mbPName').textContent = p.name || 'Pattern';
  mbEl('mbPerLayer').textContent = p.count || 0;
  mbEl('mbLayers').textContent = item.layers;
  mbEl('mbTotal').textContent = item.total;
  mbEl('mbCube').textContent = (p.cubicEff != null ? p.cubicEff : 0) + '%';
  mbDraw(item);
}

function mbDraw(item){
  var canvas = mbEl('mbCanvas');
  var card = mbEl('mbCanvasCard');
  var cssW = card.clientWidth - 20;            // minus padding
  if(cssW < 80) cssW = 280;
  var ratio = item.pL / item.pW;
  var cssH = Math.max(180, Math.min(360, cssW * ratio));
  var dpr = window.devicePixelRatio || 1;
  canvas.style.width = cssW + 'px';
  canvas.style.height = cssH + 'px';
  canvas.width = Math.round(cssW * dpr);
  canvas.height = Math.round(cssH * dpr);

  var ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cssW, cssH);

  var pad = 14;
  var scale = Math.min((cssW - 2*pad) / item.pW, (cssH - 2*pad) / item.pL);
  var ox = (cssW - item.pW * scale) / 2;
  var oy = (cssH - item.pL * scale) / 2;

  // pallet base
  ctx.fillStyle = '#141414';
  ctx.fillRect(ox, oy, item.pW * scale, item.pL * scale);
  ctx.strokeStyle = '#555'; ctx.lineWidth = 2;
  ctx.strokeRect(ox, oy, item.pW * scale, item.pL * scale);

  // cases
  var pls = item.p.placements || [];
  for(var i=0;i<pls.length;i++){
    var pl = pls[i];
    var x = ox + pl.x * scale, y = oy + pl.y * scale;
    var w = pl.w * scale, l = pl.l * scale;
    ctx.fillStyle = (pl.ori === 0) ? '#f5a623' : '#c8831a';
    ctx.fillRect(x + 1, y + 1, w - 2, l - 2);
    ctx.strokeStyle = '#252525'; ctx.lineWidth = 1.5;
    ctx.strokeRect(x + 1, y + 1, w - 2, l - 2);
  }
}

// Swipe between patterns
(function(){
  var sx = 0, sy = 0, tracking = false;
  var card = mbEl('mbCanvasCard');
  if(!card) return;
  card.addEventListener('touchstart', function(e){
    var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; tracking = true;
  }, { passive:true });
  card.addEventListener('touchend', function(e){
    if(!tracking) return; tracking = false;
    var t = e.changedTouches[0];
    var dx = t.clientX - sx, dy = t.clientY - sy;
    if(Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)) mbStep(dx < 0 ? 1 : -1);
  }, { passive:true });
})();

// Build a desktop-compatible .kbm bundle from the current pattern's inputs.
function mbBuildBundle(){
  var inp = MB.lastInputs || {};
  var name = (mbVal('mbName') || '').trim();
  if(!name){
    name = inp.cLraw + 'x' + inp.cWraw + 'x' + inp.cHraw + ' on ' + (inp.palKey || 'pallet');
  }
  var bundle = {
    version: '1.0',
    savedAt: new Date().toISOString(),
    settings: { units: (inp.isMetric ? 'mm' : 'in') },
    project: { name: name, desc: '', notes: 'Saved from mobile' },
    state: {
      isMetric: !!inp.isMetric,
      palletKey: inp.palKey || 'full',
      maxH: inp.maxHraw || '',
      maxOverhang: inp.ohRaw || '',
      palletWeightLimit: '',
      cornerPosts: false,
      slipSheets: false,
      slipSheetLayers: [],
      cases: [{ id:1, w: inp.cLraw, l: inp.cWraw, h: inp.cHraw, wt:'', color:'#3A7BD5', label:'Case A' }],
      selPat: MB.idx,
      layers: MB.patterns[MB.idx] ? MB.patterns[MB.idx].layers : 1,
      customPallet: (inp.palKey === 'custom')
        ? { label:'Custom', w: inp.pWin, l: inp.pLin, h:5.5, tare:50 } : null
    },
    truck: null
  };
  return { name: name, bundle: bundle };
}

async function mbSaveCloud(){
  if(!MB.patterns.length){ mbToast('Generate a pattern first', true); return; }
  var built = mbBuildBundle();
  mbToast('Saving to cloud...', false);
  try {
    var res = await fetch('/api/patterns', {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      credentials:'same-origin',
      body: JSON.stringify({ name: built.name, data: built.bundle })
    });
    if(res.status === 401){ mbToast('Please sign in again', true); return; }
    if(res.status === 403){ mbToast('Your access has expired', true); return; }
    if(!res.ok){ var t = await res.text().catch(function(){ return ''; });
      mbToast('Save failed: ' + (t || ('HTTP ' + res.status)), true); return; }
    var row = await res.json();
    mbToast('Saved to cloud as "' + (row && row.name ? row.name : built.name) + '"', false);
  } catch(err){
    mbToast('Save failed: ' + (err && err.message ? err.message : 'network error'), true);
  }
}

// ---- Cloud files: list / open / delete (all scoped to the signed-in user) ----
function mbEsc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}
function mbFmtDate(iso){
  try { var d = new Date(iso); return isNaN(d) ? '' : d.toLocaleDateString(); }
  catch(e){ return ''; }
}
var mbCloudTabCur = 'patterns';
var mbPdfBlobUrl = null;

function mbOpenCloud(){
  mbEl('mbCloud').hidden = false;
  mbCloudTab(mbCloudTabCur || 'patterns');
}
function mbCloseCloud(){
  mbEl('mbCloud').hidden = true;
}
function mbCloudTab(which){
  mbCloudTabCur = (which === 'reports') ? 'reports' : 'patterns';
  mbEl('mbTabPat').classList.toggle('on', mbCloudTabCur === 'patterns');
  mbEl('mbTabRpt').classList.toggle('on', mbCloudTabCur === 'reports');
  if(mbCloudTabCur === 'reports') mbLoadReportList();
  else mbLoadCloudList();
}

async function mbLoadCloudList(){
  var box = mbEl('mbCloudList');
  box.innerHTML = '<div class="mb-empty">Loading your saved files\u2026</div>';
  try {
    var res = await fetch('/api/patterns', { credentials:'same-origin' });
    if(res.status === 401){ box.innerHTML = '<div class="mb-empty">Please sign in again.</div>'; return; }
    if(res.status === 403){ box.innerHTML = '<div class="mb-empty">Your access has expired.</div>'; return; }
    if(!res.ok){ box.innerHTML = '<div class="mb-empty">Could not load files (HTTP ' + res.status + ').</div>'; return; }
    var json = await res.json();
    var rows = (json && json.patterns) || [];
    if(!rows.length){
      box.innerHTML = '<div class="mb-empty">No saved files yet.<br>Generate a pattern and tap \u201CSave to cloud.\u201D</div>';
      return;
    }
    var html = '';
    rows.forEach(function(r){
      var when = mbFmtDate(r.updated_at || r.created_at);
      var id = mbEsc(r.id);
      html += '<div class="mb-item">' +
        '<div class="meta"><div class="nm">' + mbEsc(r.name || 'Untitled pattern') + '</div>' +
        (when ? '<div class="dt">' + when + '</div>' : '') + '</div>' +
        '<button class="open" onclick="mbOpenPattern(\'' + id + '\')">Open</button>' +
        '<button class="del" onclick="mbDeletePattern(\'' + id + '\')">Delete</button>' +
        '</div>';
    });
    box.innerHTML = html;
  } catch(err){
    box.innerHTML = '<div class="mb-empty">Network error loading files.</div>';
  }
}

async function mbOpenPattern(id){
  mbToast('Opening\u2026', false);
  try {
    var res = await fetch('/api/patterns?id=' + encodeURIComponent(id), { credentials:'same-origin' });
    if(!res.ok){ mbToast('Could not open (HTTP ' + res.status + ')', true); return; }
    var row = await res.json();
    var bundle = row && row.data;
    if(!bundle || !bundle.state){ mbToast('That file is missing its saved settings', true); return; }
    mbCloseCloud();
    mbLoadBundle(bundle);
    mbToast('Opened \u201C' + (row.name || 'pattern') + '\u201D', false);
  } catch(err){
    mbToast('Open failed: ' + (err && err.message ? err.message : 'network error'), true);
  }
}

async function mbDeletePattern(id){
  if(!window.confirm('Delete this file from the cloud? This cannot be undone.')) return;
  try {
    var res = await fetch('/api/patterns?id=' + encodeURIComponent(id), {
      method:'DELETE', credentials:'same-origin'
    });
    if(!res.ok){ mbToast('Delete failed (HTTP ' + res.status + ')', true); return; }
    mbToast('Deleted', false);
    mbLoadCloudList();
  } catch(err){
    mbToast('Delete failed: ' + (err && err.message ? err.message : 'network error'), true);
  }
}

// ---- Reports: list / view (PDF) / delete (scoped to the signed-in user) ----
async function mbLoadReportList(){
  var box = mbEl('mbCloudList');
  box.innerHTML = '<div class="mb-empty">Loading your saved reports\u2026</div>';
  try {
    var res = await fetch('/api/reports', { credentials:'same-origin' });
    if(res.status === 401){ box.innerHTML = '<div class="mb-empty">Please sign in again.</div>'; return; }
    if(res.status === 403){ box.innerHTML = '<div class="mb-empty">Your access has expired.</div>'; return; }
    if(!res.ok){ box.innerHTML = '<div class="mb-empty">Could not load reports (HTTP ' + res.status + ').</div>'; return; }
    var json = await res.json();
    var rows = (json && json.reports) || [];
    if(!rows.length){
      box.innerHTML = '<div class="mb-empty">No saved reports yet.<br>In the web app, open a report and tap \u201CSave to Cloud.\u201D</div>';
      return;
    }
    var html = '';
    rows.forEach(function(r){
      var when = mbFmtDate(r.updated_at || r.created_at);
      var id = mbEsc(r.id);
      html += '<div class="mb-item">' +
        '<div class="meta"><div class="nm">' + mbEsc(r.name || 'Untitled report') + '</div>' +
        (when ? '<div class="dt">' + when + '</div>' : '') + '</div>' +
        '<button class="open" onclick="mbViewReport(\'' + id + '\')">View</button>' +
        '<button class="del" onclick="mbDeleteReport(\'' + id + '\')">Delete</button>' +
        '</div>';
    });
    box.innerHTML = html;
  } catch(err){
    box.innerHTML = '<div class="mb-empty">Network error loading reports.</div>';
  }
}

// Convert a data: URI (base64 or url-encoded) into a Blob URL. Blob URLs render
// in an <iframe> reliably across mobile browsers, unlike long data: URIs.
function mbDataUriToBlobUrl(dataUri){
  var comma = dataUri.indexOf(',');
  if(comma < 0) return null;
  var meta = dataUri.slice(5, comma);           // strip leading "data:"
  var mime = (meta.split(';')[0]) || 'application/pdf';
  var isB64 = /;base64/i.test(meta);
  var payload = dataUri.slice(comma + 1);
  var bytes;
  if(isB64){
    var bin = atob(payload);
    bytes = new Uint8Array(bin.length);
    for(var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  } else {
    bytes = new TextEncoder().encode(decodeURIComponent(payload));
  }
  return URL.createObjectURL(new Blob([bytes], { type: mime }));
}

async function mbViewReport(id){
  mbToast('Opening report\u2026', false);
  try {
    var res = await fetch('/api/reports?id=' + encodeURIComponent(id), { credentials:'same-origin' });
    if(!res.ok){ mbToast('Could not open (HTTP ' + res.status + ')', true); return; }
    var row = await res.json();
    if(!row || !row.pdf){ mbToast('That report has no saved PDF', true); return; }
    var url = mbDataUriToBlobUrl(row.pdf);
    if(!url){ mbToast('Could not read that report', true); return; }
    if(mbPdfBlobUrl){ URL.revokeObjectURL(mbPdfBlobUrl); }
    mbPdfBlobUrl = url;
    mbEl('mbPdfTtl').textContent = row.name || 'Report';
    mbEl('mbPdfFrame').src = url;
    mbEl('mbPdf').hidden = false;
  } catch(err){
    mbToast('Open failed: ' + (err && err.message ? err.message : 'network error'), true);
  }
}

function mbClosePdf(){
  mbEl('mbPdf').hidden = true;
  mbEl('mbPdfFrame').src = 'about:blank';
  if(mbPdfBlobUrl){ URL.revokeObjectURL(mbPdfBlobUrl); mbPdfBlobUrl = null; }
}

async function mbDeleteReport(id){
  if(!window.confirm('Delete this report from the cloud? This cannot be undone.')) return;
  try {
    var res = await fetch('/api/reports?id=' + encodeURIComponent(id), {
      method:'DELETE', credentials:'same-origin'
    });
    if(!res.ok){ mbToast('Delete failed (HTTP ' + res.status + ')', true); return; }
    mbToast('Deleted', false);
    mbLoadReportList();
  } catch(err){
    mbToast('Delete failed: ' + (err && err.message ? err.message : 'network error'), true);
  }
}

// Rehydrate the input form from a saved .kbm bundle, then regenerate + jump to
// the pattern that was selected when it was saved.
function mbLoadBundle(bundle){
  var st = (bundle && bundle.state) || {};
  mbSetUnit(st.isMetric ? 'mm' : 'in');

  var c = (st.cases && st.cases[0]) || {};
  mbEl('mbCaseL').value = (c.w != null && c.w !== '') ? c.w : '';   // w = Length (see mbBuildBundle)
  mbEl('mbCaseW').value = (c.l != null && c.l !== '') ? c.l : '';   // l = Width
  mbEl('mbCaseH').value = (c.h != null && c.h !== '') ? c.h : '';   // h = Height
  mbEl('mbMaxH').value  = (st.maxH != null && st.maxH !== '') ? st.maxH : 60;
  mbEl('mbOH').value    = (st.maxOverhang != null) ? st.maxOverhang : '';

  var pk = st.palletKey || 'full';
  mbEl('mbPallet').value = pk;
  mbPalletChange();
  if(pk === 'custom' && st.customPallet){
    // customPallet is stored in inches; show it in the active display unit.
    var f = st.isMetric ? 25.4 : 1;
    var rnd = function(v){ return Math.round(v * f * 100) / 100; };
    mbEl('mbPalW').value = (st.customPallet.w != null) ? rnd(st.customPallet.w) : '';
    mbEl('mbPalL').value = (st.customPallet.l != null) ? rnd(st.customPallet.l) : '';
  }

  mbEl('mbName').value = (bundle.project && bundle.project.name) ? bundle.project.name : '';

  mbGenerate();

  var want = parseInt(st.selPat, 10);
  if(!isNaN(want) && want >= 0 && want < MB.patterns.length){
    MB.idx = want;
    mbRenderPattern();
  }
}

// init
mbInitPallets();
mbPalletChange();
</script>
